name: Deploy Space Forum to GitHub Pages

on:
  push:
    branches: [claude/space-company-forum-hsn292, main]
    paths: [space-forum/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: space-forum/package-lock.json

      - name: Install dependencies
        working-directory: space-forum
        run: npm ci

      - name: Build
        working-directory: space-forum
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: space-forum/dist
          destination_dir: space-forum
