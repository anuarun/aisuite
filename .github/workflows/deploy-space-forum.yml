name: Deploy Space Forum to GitHub Pages

on:
  push:
    branches: [claude/space-company-forum-hsn292, main]
    paths: [space-forum/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: space-forum/package-lock.json

      - name: Install dependencies
        working-directory: space-forum
        run: npm ci

      - name: Build
        working-directory: space-forum
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: space-forum/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
